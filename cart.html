<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Корзина</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .top-left-area {
      padding: 20px;
    }
    .bottom-center-area {
      margin-top: auto;
      text-align: center;
      padding-bottom: 30px;
    }
    .custom-btn {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-weight: 600;
      background-color: #2e8b57;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }
    .custom-btn:hover {
      background-color: #228b22;
    }
    .content {
      padding: 20px;
      flex: 1;
    }
  </style>
</head>
<body>
  <div class="top-left-area">
    <a href="index.html" class="custom-btn">Назад</a>
  </div>
  <div class="content">
    <h2>Корзина</h2>
    <p>Здесь будут товары из корзины.</p>
  </div>
</body>
</html>
