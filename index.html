<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Магазин</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Верхняя строка: растягиваем, чтобы История была слева, Меню — справа */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      width: 100%;
      box-sizing: border-box;
    }

    .bottom-center-area {
      margin-top: auto;
      text-align: center;
      padding-bottom: 30px;
    }

    .custom-btn {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-weight: 600;
      background-color: #2e8b57;       /* спокойный зелёный */
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    .custom-btn:hover {
      background-color: #228b22;      /* чуть темнее при наведении */
    }
  </style>
</head>
<body>

  <!-- Верхняя панель: История слева, Меню справа -->
  <div class="top-bar">
    <a href="history.html" class="custom-btn">История</a>
    <a href="menu.html" class="custom-btn">Меню</a>
  </div>

  <!-- Корзина по центру снизу -->
  <div class="bottom-center-area">
    <a href="cart.html" class="custom-btn">Корзина</a>
  </div>

</body>
</html>
<div class="product-slider">
  <div class="product">Вода</div>
  <div class="product">Кириешки</div>
  <div class="product">Хлеб</div>
  <div class="product">Молоко</div>
  <div class="product">Сахар</div>
</div>
