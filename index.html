
<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Кнопки: Корзина и История</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Верхняя панель с кнопкой «История» */
      header {
        padding: 15px 20px;
        background-color: #f5f5f5;
      }

      .history-btn {
        padding: 8px 16px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
      }

      .history-btn:hover {
        background-color: #0056b3;
      }

      /* Основная область страницы (чтобы кнопка «Корзина» была внизу) */
      main {
        flex: 1; /* Занимает всё свободное место, выталкивая футер вниз */
        padding: 20px;
      }

      /* Нижняя панель с кнопкой «Корзина» по центру */
      footer {
        text-align: center;
        padding: 20px 0;
        background-color: #fafafa;
        border-top: 1px solid #e0e0e0;
      }

      .cart-btn {
        padding: 12px 32px;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
      }

      .cart-btn:hover {
        background-color: #218838;
      }
    </style>
  </head>
  <body>
    <!-- Кнопка «История» — слева сверху -->
    <header>
      <button class="history-btn" onclick="alert('Нажата кнопка История')">История</button>
    </header>


    <!-- Кнопка «Корзина» — по центру снизу -->
    <footer>
      <button class="cart-btn" onclick="alert('Нажата кнопка Корзина')">Корзина</button>
    </footer>
  </body>
</html>
