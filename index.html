<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Кнопки: Корзина и История</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        padding: 15px 20px;
        background-color: #f8f9fa;
        /* Важно: явно задаём выравнивание по левому краю */
        text-align: left;
      }

      .history-btn {
        padding: 10px 18px;
        background-color: #2e8b57;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 15px;
        font-weight: 600;
        transition: background-color 0.2s ease;
      }

      .history-btn:hover {
        background-color: #226b40;
      }

      main {
        flex: 1;
        padding: 20px;
      }

      footer {
        text-align: center;
        padding: 25px 0;
        background-color: #fafafa;
        border-top: 1px solid #e5e5e5;
      }

      .cart-btn {
        padding: 14px 36px;
        background-color: #2e8b57;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.1s ease, background-color 0.2s ease;
      }

      .cart-btn:hover {
        background-color: #226b40;
      }

      .cart-btn:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/history.html" class="history-btn">История</a>
    </header>
    
    <footer>
      <a href="/cart.html" class="cart-btn">Корзина</a>
    </footer>
  </body>
</html>
