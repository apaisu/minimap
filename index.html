<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Для кнопок */
        .btn-cart, .btn-history {
            padding: 10px 20px;
            font-size: 16px; /* Другой шрифт — чуть крупнее по умолчанию */
            border: none;
            border-radius: 5px;
            cursor: pointer;
            /* Чтобы убрать стандартное синее выделение при фокусе */
            outline: none;
        }
        .btn-cart {
            background-color: #4CAF50; /* Зелёный фон (не кислотный) */
            color: white; /* Белый текст */
            margin: 10px 0; /* Отступ сверху снизу */
        }
        .btn-cart:focus {
            outline: none; /* Снимаем синее свечение */
        }
        .btn-history {
            background-color: #4CAF50;
            color: white;
            margin-left: 10px; /* Слева сверху */
        }
        .btn-history:focus {
            outline: none;
        }

        /* Позиционирование через CSS */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center; /* Центруем контент вертикально */
        }

        .bottom-center {
            display: flex;
            justify-content: center; /* Середина горизонтали (корзина внизу) */
            margin-bottom: 20px;
        }

        .top-left {
            position: absolute;
            top: 20px;
            left: 20px;
        }
    </style>
</head>
<body>

    <!-- Кнопка «Корзина» -->
    <div class="container bottom-center">
        <button class="btn-cart cart-btn" onclick="window.location.href='basket.html'">Корзина</button>
    </div>

    <!-- Кнопка «История» -->
    <div class="container top-left">
        <button class="btn-history history-btn" onclick="window.location.href='history.html'">История</button>
    </div>

</body>
</html>
